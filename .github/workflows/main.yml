name: Compilar VST3 (Windows x64)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Compilar
        run: cmake --build build --config Release --target UrbanKeys_VST3

      - name: Empaquetar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item -Recurse "build/UrbanKeys_artefacts/Release/VST3/*" dist/
          Copy-Item installer/Instalar.bat dist/

      - name: Subir resultado
        uses: actions/upload-artifact@v4
        with:
          name: UrbanKeysFL26-VST3-Windows-x64
          path: dist
